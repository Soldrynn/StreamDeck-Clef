<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Volume key settings</title>
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Volume step">
    <sdpi-select setting="volumeStepPercent" value-type="number" default="5">
      <option value="1">1%</option>
      <option value="2">2%</option>
      <option value="3">3%</option>
      <option value="4">4%</option>
      <option value="5">5%</option>
      <option value="6">6%</option>
      <option value="7">7%</option>
      <option value="8">8%</option>
      <option value="9">9%</option>
      <option value="10">10%</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item>
    <small>How much each press changes only the Apple Music for Windows volume. Hold the key to keep adjusting.</small>
  </sdpi-item>
</body>
</html>
